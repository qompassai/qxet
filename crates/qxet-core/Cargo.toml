[package]
name = "qxet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Content-addressed store core for qxet: FastCDC chunking, SHA-256 CAS, manifests, verify, gc"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
