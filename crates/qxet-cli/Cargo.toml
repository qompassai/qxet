[package]
name = "qxet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the qxet content-addressed store"

[[bin]]
name = "qxet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
qxet-core = { path = "../qxet-core" }

[dev-dependencies]
tempfile = "3"
